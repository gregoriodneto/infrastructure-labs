services:
  order:
    build: ./order
    environment:
      INVENTORY_URL: http://inventory:3000
      INVENTORY_TIMEOUT_SECONDS: "4"
    ports:
      - "127.0.0.1:8080:8000"
    networks:
      - frontend

  inventory:
    build: ./inventory
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: inventory
      PGPASSWORD: inventory_lab
      PGDATABASE: inventory
      PG_TIMEOUT_MS: "1500"
    networks:
      - services

  postgres:
    build: ./database
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_lab
      POSTGRES_DB: inventory
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  frontend:
  services:
  data:

volumes:
  inventory_data:
