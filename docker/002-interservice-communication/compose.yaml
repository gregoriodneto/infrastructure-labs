services:
  order:
    build: ./order
    env_file:
      - .env
    environment:
      INVENTORY_URL: ${INVENTORY_URL}
      INVENTORY_TIMEOUT_SECONDS: ${INVENTORY_TIMEOUT_SECONDS}
    ports:
      - "127.0.0.1:8080:8000"
    networks:
      - frontend
      - services

  inventory:
    build: ./inventory
    env_file:
      - .env
    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PG_TIMEOUT_MS: ${PG_TIMEOUT_MS}
    networks:
      - services
      - data

  postgres:
    build: ./database
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_lab
      POSTGRES_DB: inventory
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  frontend:
  services:
  data:

volumes:
  inventory_data:
